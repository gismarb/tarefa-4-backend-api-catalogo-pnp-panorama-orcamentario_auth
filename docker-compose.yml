services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-pnp-panorama-auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: pnp_user
      POSTGRES_PASSWORD: pnp_password
      POSTGRES_DB: pnp_panorama_auth
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data

volumes:
  postgres_auth_data: